version: 2
updates:
  # Python dependencies (poetry, pyproject.toml/poetry.lock at repo root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # JavaScript dependencies for the web app
  - package-ecosystem: "npm"
    directory: "/alfalfa_web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
    groups:
      npm-dependencies:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/alfalfa_web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/alfalfa_worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/grafana"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
