# Docker-compose setup for local development with the Historian. This allows for a user
# to modify the Alfalfa worker code and run tests in the Docker
# container without needing to rebuild/restart Docker.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build --scale worker=2
#     with historian use
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.historian.yml up --build --scale worker=2

services:
  web: # main haystack application
    container_name: alfalfa_web
    build:
      # the purpose of context one level above dockerfile
      # is to utilize shared code, specifically in db
      dockerfile: alfalfa_web/Dockerfile
      context: .
      # The dev instance still needs works, so default to base for now
      target: dev
    environment:
      - NODE_ENV=development
      - HISTORIAN_ENABLE=true
      - GRAFANA_URL_EXTERNAL
    volumes:
      - ./alfalfa_web:/srv/alfalfa
      # create volumes for the build and node_modules so that
      # the resources are not copied back to the local host when
      # mounting.
      - /srv/alfalfa/build
      - /srv/alfalfa/node_modules
  worker:
    build:
      # the purpose of context one level above is to install the entire alfalfa package
      # and to copy the wait-for-it.sh and start_worker.sh files in the deploy directory
      dockerfile: alfalfa_worker/Dockerfile
      context: .
      target: dev
    environment:
      - HISTORIAN_ENABLE=true
    volumes:
      - ./alfalfa_worker:/alfalfa/alfalfa_worker
      - ./tests:/alfalfa/tests
  influxdb:
    container_name: alfalfa_influxdb
    image: influxdb:1.8
    hostname: ${INFLUXDB_HOST}
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB
      - INFLUXDB_HTTP_AUTH_ENABLED=${INFLUXDB_HTTP_AUTH_ENABLED}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_USERNAME}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
    restart: always
  grafana:
    container_name: alfalfa_grafana
    build:
      context: "./grafana"
      args:
        - INFLUXDB_ADMIN_USER=${INFLUXDB_USERNAME}
        - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
        - INFLUXDB_DB
        - INFLUXDB_HOST
    hostname: grafana
    image: ${REGISTRY_BASE_URI}/grafana:${VERSION_TAG}
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
      - INFLUXDB_DB
      - INFLUXDB_HOST
      - INFLUXDB_ADMIN_USER=${INFLUXDB_USERNAME}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
    depends_on:
      - ${INFLUXDB_HOST}
